secrets:
  ca_bundle:
    file: ${HOME}/.ca-bundle.pem

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asknow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      secrets:
        - ca_bundle
      args:
        # Constructed from JFROG_API_KEY in .env — no manual URL needed
        PIP_INDEX_URL: https://matmulle%40visa.com:${JFROG_API_KEY}@tink.jfrog.io/artifactory/api/pypi/pypi/simple/
    command: >
      sh -c "alembic upgrade head &&
             uvicorn web.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/asknow
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
